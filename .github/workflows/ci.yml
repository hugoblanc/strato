name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # the binary of this runner's platform starts and carries its embedded files
      - run: bun run build:host
      - run: ../dist/strato-* version
      - run: ../dist/strato-* policy-default worker | head -1
      # the compiled binary loads external providers from disk: the tests that `bun run check` skips without a binary
      - run: bun test ./compiled-provider.test.ts
